name: UNIX CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: "80"
  CRYSTAL_BOOTSTRAP_VERSION: "1.21.0"

jobs:
  test-std:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: freebsd
            arch: x86_64
            version: "14.5"

          - name: netbsd
            arch: x86_64
            version: "10.1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{matrix.os.name}}
          architecture: ${{matrix.os.arch}}
          version: ${{matrix.os.version}}
          memory: 8G
          shell: bash
          environment_variables: SPEC_SPLIT_DOTS CRYSTAL_BOOTSTRAP_VERSION

      - name: Setup VM
        run: |
          case "${{matrix.os.name}}" in
            freebsd)
              sudo pkg install -y git gmake pkgconf
              sudo pkg install -y boehm-gc-threaded gmp libxml2 libyaml llvm22 openssl pcre2
              ;;
            netbsd)
              sudo pkgin -y install git gmake pkgconf
              sudo pkgin -y install boehm-gc gmp libxml2 libyaml lld llvm openssl pcre2
              ;;
          esac
        shell: cpa.sh {0}

      - name: Install Crystal
        run: |
          curl -sL "https://crystal.s3.gra.io.cloud.ovh.net/crystal-${CRYSTAL_BOOTSTRAP_VERSION}-1-${{matrix.os.name}}-${{matrix.os.arch}}.tar.xz" | tar -C /tmp -xJf -
          echo "export PATH=$PATH:/tmp/crystal-${CRYSTAL_BOOTSTRAP_VERSION}/bin" | sudo tee -a /etc/profile
          /tmp/crystal-${CRYSTAL_BOOTSTRAP_VERSION}/bin/crystal version
          /tmp/crystal-${CRYSTAL_BOOTSTRAP_VERSION}/bin/crystal env
        shell: cpa.sh {0}

      - name: Test
        run: gmake std_spec
        shell: cpa.sh {0}

