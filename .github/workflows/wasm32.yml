name: WebAssembly CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  SPEC_SPLIT_DOTS: "160"
  PCRE2_VERSION: "10.49"
  WASI_SDK_VERSION: "33"
  WASMTIME_VERSION: "50.0.0"

jobs:
  wasm32-test:
    runs-on: ubuntu-24.04
    steps:
      - name: "Download Crystal source"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Uninstall LLVM and clang"
        run: |
          sudo apt-get remove -y 'llvm-*' 'libllvm*'

      - name: "Install LLVM 24"
        run: |
          curl -sL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository -y deb http://apt.llvm.org/noble/ llvm-toolchain-noble main
          sudo apt-get install -qy llvm-24-dev

      #- name: "Install wasi-sysroot and libclang_rt"
      #  run: |
      #    mkdir -p /tmp/wasi-sysroot /tmp/libclang_rt
      #    curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sysroot-$WASI_SDK_VERSION.0.tar.gz" | tar -C /tmp/wasi-sysroot -xzf - --strip-components=1
      #    curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/libclang_rt-$WASI_SDK_VERSION.0.tar.gz" | tar -C /tmp/libclang_rt -xzf - --strip-components=1

      - name: "Install wasi-sdk"
        run: |
          mkdir -p /tmp/wasi-sdk
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK_VERSION/wasi-sdk-$WASI_SDK_VERSION.0-x86_64-linux.tar.gz" | tar -C /tmp/wasi-sdk -xzf - --strip-components=1
          echo /tmp/wasi-sdk/bin >> "$GITHUB_PATH"
          sudo ln -sf /tmp/wasi/sdk/bin/wasm-ld /usr/bin/wasm-ld

      - name: "Build libpcre2-8.a"
        run: |
          mkdir -p /tmp/pcre2
          curl -sL "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-$PCRE2_VERSION/pcre2-$PCRE2_VERSION.tar.gz" | tar -C /tmp/pcre2 -xzf - --strip-components=1
          cd /tmp/pcre2
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_STATIC_PIC=ON \
            -DPCRE2_SUPPORT_JIT=OFF \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF
          cmake --build build --parallel
        env:
          CFLAGS: "--target=wasm32-wasip1 --sysroot=/tmp/wasi-sdk/share/wasi-sysroot"
          CC: /tmp/wasi-sdk/bin/clang

      - name: "Install wasmtime"
        run: |
          mkdir -p /tmp/wasmtime
          curl -sL "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/wasmtime-v$WASMTIME_VERSION-x86_64-linux.tar.xz" | tar -C /tmp/wasmtime -xJf - --strip-components=1
          echo "/tmp/wasmtime" >> "$GITHUB_PATH"

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22

      - name: "Build Crystal"
        run: make crystal LLVM_CONFIG=llvm-config-24

      - name: "Build spec/wasm32_std_spec.cr"
        run: |
          bin/crystal build spec/wasm32_std_spec.cr -o wasm32_std_spec.wasm --target wasm32-wasi --link-flags="-z stack-size=8388608" -Dwithout_iconv -Dwithout_openssl -Dwithout_zlib -Dwithout_mt
        env:
          CRYSTAL_LIBRARY_PATH: "/tmp/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1:/tmp/wasi-sdk/lib/clang/22/lib/wasm32-unknown-wasip1:/tmp/pcre2/build"

      - name: "Run wasm32_std_spec.wasm"
        run: |
          wasmtime run --dir . wasm32_std_spec.wasm
